; GottFA80 PLuS — ESP32-S3 companion firmware
; Pstore Pinball Platform — "ESP32 bridge"
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; --- ESP32-S3 N16R8: 16 MB QIO flash + 8 MB OPI (octal) PSRAM ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3 -DBOARD_HAS_PSRAM
board_build.filesystem = littlefs
; Stamps FW_GIT / FW_BUILD into the binary from git (see version.py). Reported by
; /sysinfo, /link, /routes, the web UI and the OLED splash, so a board in the field
; can be tied back to an exact commit. FW_BUILD is the COMMIT date, not the wall
; clock, so rebuilding the same commit gives a byte-identical firmware.bin.
extra_scripts = pre:version.py
; --- Son 80B (PSOROM / synth YM2151 via ymfm) repoussé : exclu du build S3. -------------------
; L'app S3 (main.cpp) utilise wavplayer (samples WAV) via sndroute — chaîne WAV indépendante.
; psorom/ym2151w/ymfm_opm exigent C++17 et ne sont atteints que par le banc gosowav.
; Pour réactiver le son 80B plus tard : retirer cette ligne (+ ajouter cxx17.py comme gosowav).
; fake6502.c is excluded too: it is the 6502 core the PSOROM path uses, and psorom.cpp
; is the ONLY thing that references it. It was still being compiled into the S3 app —
; ~34 KB of source, all of it dropped again by -ffunction-sections/--gc-sections, so it
; cost build time and read as "the app runs a 6502" to anyone opening the object list.
; (arena_*.cpp / arenaled.cpp = the standalone Arena Wall-Art LED firmware, env:arenaled — never part of this app.)
build_src_filter = +<*> -<psorom.cpp> -<chefv2.cpp> -<ym2151w.cpp> -<ymfm_opm.cpp> -<emu2149.c> -<sp0250.cpp> -<gosowav_psorom.cpp> -<gosowav_diag.cpp> -<fake6502.c> -<arena_main.cpp> -<arenaled.cpp> -<arena_map.cpp> -<arena_net.cpp> -<arena_pf.cpp> -<arena_attract.cpp> -<arena_oled.cpp>
lib_deps =
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11
; Flashing/monitoring through the S3 *native USB* port (not the UART bridge)?
; Append:  -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
; Upload the web UI (data/) to LittleFS:  pio run -t uploadfs

; ================================================================================================
; esp32c3 — EXPERIMENTAL. **NOT PART OF v1. NEVER RUN ON HARDWARE.**
; ------------------------------------------------------------------------------------------------
; It COMPILES again as of v1.0.0 (it had been broken: jtag.cpp used the S3 spelling of the GPIO
; registers, net.cpp declared an array called HZ which is a macro in the RISC-V newlib headers, and
; /led referenced the S3-only PIN_RGB_LED). Compiling is all it does — no C3 board has ever been
; built, flashed or measured, and the target is missing most of the product by construction:
;   - no sound tier at all (no PSRAM, no I2S DAC, no sound SD) -> PSOWAV, /snd, /beep are 501
;   - no ROM store, no EPROM reader, no OLED, no WS2812 status beacon
;   - no display injection -> NO TIME-ATTACK
;   - GPIO0 is JTAG TCK there, so the BOOT-button factory WiFi reset is compiled out
;   - 4 MB flash, ~78% of the app partition already used
; Kept as a compile-checked target so the code stays portable, and because it is a real fallback if
; S3 modules get scarce. Do not ship it. `./build.sh --all` compiles it to keep it from rotting.
; ================================================================================================
[env:esp32c3]
extends = env:esp32s3
board = esp32-c3-devkitm-1
build_flags = -DCORE_DEBUG_LEVEL=3 -DBOARD_C3
; C3 = 4 MB QSPI flash, no PSRAM — override the N16R8 memory settings inherited via extends
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv

; --- Ralf's GOSOWAV board (ESP32-WROVER + MCP4921 SPI DAC + 4-bit SDMMC) -------------------------
; Minimal PSOROM bench: runs OUR 6502 emulator on real hardware, streams the emulated 80B DAC to the
; MCP4921, prints the real 6502-cycles/sec throughput. 100% our code (PD Fake6502); nothing reused
; from PWAVplayer. Build: pio run -e gosowav  -> flash, put /yrom1.snd + /drom1.snd on the SD, open
; serial @115200. build_src_filter compiles ONLY the bench + emulator (not the S3 app).
[env:gosowav]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DGOSOWAV_BENCH -DCORE_DEBUG_LEVEL=3 -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11
extra_scripts = post:cxx17.py
build_src_filter = -<*> +<gosowav_psorom.cpp> +<psorom.cpp> +<chefv2.cpp> +<fake6502.c> +<emu2149.c> +<sp0250.cpp> +<ym2151w.cpp> +<ymfm_opm.cpp> +<wavmix.cpp> +<wavfile.cpp> +<wavsrc.cpp> +<wavset.cpp>

; Bisect-only: bare SoftAP + WebServer (no SD, no emulator). Proves the WROVER web stack in
; isolation -> separates "firmware blocked in setup()" from "board/client" faults.
; Build: pio run -e gosowav_diag -t upload   ->  join 'GOSOWAV-DIAG', open http://192.168.4.1/
[env:gosowav_diag]
extends = env:gosowav
build_flags = -DGOSOWAV_DIAG -DCORE_DEBUG_LEVEL=3
build_src_filter = -<*> +<gosowav_diag.cpp>

; --- Arena Wall-Art LED (decoration, no FPGA/sound) ---------------------------------------------
; Gottlieb "Arena" playfield turned into an illuminated wall piece: ESP32-S3 + up to 150
; SK6812MINI-RGBW on one data chain, WiFi web UI, power-metered effects. See ARENA_LED.md.
; Standalone firmware: build_src_filter compiles ONLY the arena files (none of the GottFA app).
;   pio run -e arenaled -t uploadfs   (web UI -> LittleFS)   then   pio run -e arenaled -t upload
[env:arenaled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3 -DBOARD_HAS_PSRAM -DARENA_LED
build_src_filter = -<*> +<arena_main.cpp> +<arena_oled.cpp> +<arenaled.cpp> +<arena_map.cpp> +<arena_net.cpp> +<arena_pf.cpp> +<arena_attract.cpp>
lib_deps =
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit NeoPixel@^1.12
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11

; --- WEMOS/LOLIN "D1 Mini ESP32" (ESP32-WROOM-32, 4 MB flash, CH340C, micro-USB) ---------------
; The board most people actually have in a drawer. Same firmware, data on GPIO27 (see
; arena_config.h for why 27 and not 5). Micro-USB: hold the BOOT/IO0 pad if auto-reset fails.
;   pio run -e arenaled_d1mini32 -t uploadfs   then   pio run -e arenaled_d1mini32 -t upload
[env:arenaled_d1mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=3 -DARENA_LED -DARENA_BOARD_D1MINI32
build_src_filter = -<*> +<arena_main.cpp> +<arena_oled.cpp> +<arenaled.cpp> +<arena_map.cpp> +<arena_net.cpp> +<arena_pf.cpp> +<arena_attract.cpp>
lib_deps =
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit NeoPixel@^1.12
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11

; Same firmware on the cheaper ESP32-C3 (4 MB flash, no PSRAM). Build: pio run -e arenaled_c3
[env:arenaled_c3]
extends = env:arenaled
board = esp32-c3-devkitm-1
build_flags = -DCORE_DEBUG_LEVEL=3 -DBOARD_C3 -DARENA_LED
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv

; Test bruit : firmware identique a gosowav MAIS aucune radio (ni AP ni STA, WiFi off des le boot).
; Si le bruit de fond disparait avec ce build -> c'est le WiFi (couplage RF/3.3V). Sinon -> masse/alim.
; Build: pio run -e gosowav_nowifi -t upload  (l'Arena se charge seule, ecoute, rien a joindre)
[env:gosowav_nowifi]
extends = env:gosowav
build_flags = -DGOSOWAV_BENCH -DGOSOWAV_NOWIFI -DCORE_DEBUG_LEVEL=3 -DBOARD_HAS_PSRAM
